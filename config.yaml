# Trading parameters
symbol: TAO/USDT
timeframe: "4h"          # candle interval for fetch_ohlcv
limit: 200              # number of candles to fetch
poll_interval: 60        # seconds between loops

# Risk & sizing
initial_capital: 10000      # starting capital (USDT)
leverage: 10
risk_per_trade: 0.01     # fraction of balance risked per trade

# ATR-based stop/target
atr_window: 14           # look-back for ATR
atr_multiplier: 2.0      # stop-loss = entry ± (ATR * this)
tp_multiplier: 3.0       # take-profit = entry ± (ATR * this)

# Fees
maker_fee: 0.0002        # 0.02%
taker_fee: 0.0004        # 0.04%

# Misc
paper_mode: false
font_size: 14
trade_log_file: data/trades.csv
