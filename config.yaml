# === Market / Timeframe ===
symbol:        BTC/USDT
timeframe:     "1h"
limit:         1000
poll_interval: 500

# === Capital & Risk ===
initial_capital: 1000
leverage:        50
risk_per_trade:  0.5

# === ATR / Stop-Target ===
atr_window:     20
atr_multiplier: 2.0        # static stop-loss = 2×ATR
tp_multiplier:  3.5        # take-profit   = 3.5×ATR
trailing_atr_multiplier: 1.5  # trailing stop = 1.5×ATR below peak

# === Trend Filter ===
adx_window:     14
adx_threshold:  25
ma_period:      200

# === Time-Stop ===
max_holding_bars: 48

# === Fees ===
maker_fee:      0.0002
taker_fee:      0.0004

# === Misc ===
paper_mode:     false
trade_log_file: data/trades.csv


commission: 0.0004      # 0.04%
slippage:   0.0005      # 0.05%
